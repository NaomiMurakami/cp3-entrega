<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Meu Site Pessoal</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <h1>Meu Site Pessoal</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
                <li><a href="formulario.html" class="ativo">Contato</a></li>
                <li><a href="multimidia.html">Multimídia</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Entre em Contato</h2>
        <form action="#" method="post">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="motivo">Motivo do Contato:</label>
                <select id="motivo" name="motivo">
                    <option value="duvida">Dúvidas</option>
                    <option value="parceria">Proposta de Parceria</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" required placeholder="Assunto da mensagem">
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>
        </form>
        
        <section style="margin-top: 20px;">
            <h2>Tema do fundo</h2>
            <div class="trilho" id="trilho">
                <div class="indicador"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

    <footer>
        <p>&copy; 2026. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
